<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wordle Buddy Panel</title>
</head>
<body>
  <div id="wordle-buddy-panel">
    <div class="panel-header">
      <h3>Wordle Buddy</h3>
      <div class="header-buttons">
        <!-- <button id="settings-btn" class="header-btn" title="Settings">⚙️</button> -->
        <button id="toggle-panel" class="minimize-btn">−</button>
      </div>
    </div>
    
    <div class="panel-content">
      <!-- Possible Permutations Section -->
      <div class="section">
        <h4>Possible Permutations</h4>
        <div id="permutations-display" class="info-box">
          <p class="placeholder">Play a word to see permutations</p>
        </div>
      </div>

      <!-- User Notes Section -->
      <div class="section notes-section">
        <h4>Your Notes</h4>
        <textarea 
          id="user-notes" 
          class="notes-area" 
          placeholder="Jot down words you're considering..."></textarea>
      </div>

      <!-- Constraints Summary (Collapsible) -->
      <div class="section" style="margin-bottom: 8px;">
        <h4 class="collapsible-header" id="constraints-header">
          <span>Constraint Details</span>
          <span class="collapse-icon">▼</span>
        </h4>
        <div id="constraints-content" class="collapsible-content collapsed">
          <div id="constraints-display" class="info-box">
            <p class="placeholder">No constraints yet</p>
          </div>
        </div>
      </div>

    </div>
    <div class="resize-indicator" aria-hidden="true"></div>
  </div>
</body>
</html>
