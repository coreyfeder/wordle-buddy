<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: 'Clear Sans', Arial, sans-serif;
      margin: 0;
    }
    h2 {
      margin: 0 0 15px 0;
      color: #6aaa64;
      font-size: 18px;
    }
    p {
      margin: 0 0 10px 0;
      font-size: 14px;
      line-height: 1.5;
      color: #333;
    }
    .status {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      color: #666;
    }
    .link {
      color: #6aaa64;
      text-decoration: none;
      font-weight: 600;
    }
    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2>Wordle Buddy</h2>
  <p>Navigate to <a href="https://www.nytimes.com/games/wordle/index.html" class="link" target="_blank">NYT Wordle</a> or <a href="https://www.nytimes.com/games/create/wordle/" class="link" target="_blank">Custom Puzzles</a> to use the buddy.</p>
  <p>The panel will appear on the right side of the game.</p>
  <div class="status">
    <strong>Features:</strong><br>
    • Works on NYT Wordle and Custom Puzzles<br>
    • Detects word length (4-7 letters)<br>
    • Displays permutations<br>
    • Notes area for your ideas<br>
  </div>
</body>
</html>
